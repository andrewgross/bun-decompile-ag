name: Rust

on:
  push:
    branches: [main, rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  # The library claims rust-version 1.85 (edition 2024 floor). Prove it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Slow: downloads Bun releases and compiles ~60MB binaries. Proves the Rust
  # CLI matches the TS CLI byte-for-byte (parity) and extracts real binaries
  # across the version/target matrix (e2e). Linux only, like the TS e2e job.
  parity-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache downloaded Bun versions
        uses: actions/cache@v4
        with:
          path: ~/.cache/bun-decompile
          key: bun-versions-${{ hashFiles('src/scripts/e2e-test.sh', 'src/scripts/get-bun.sh') }}

      - run: bun install --frozen-lockfile
      - run: cargo build --release -p bun-decompile-ag-cli

      - name: Parity (TS CLI vs Rust CLI), including the cross-target matrix
        run: bash src/scripts/parity-test.sh --full

      - name: E2E with the Rust CLI
        run: DECOMPILE_CMD="$PWD/target/release/bun-decompile" bash src/scripts/e2e-test.sh

  # Smoke-fuzz both entry points for the no-panic contract. Not a campaign —
  # 60s per target, corpus seeded from the committed fixtures.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz"
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpus from fixtures
        run: |
          mkdir -p fuzz/corpus/extract
          cp src/lib/tests/fixtures/*.bin fuzz/corpus/extract/
      - run: cargo fuzz run extract fuzz/corpus/extract -- -max_total_time=60
      - run: cargo fuzz run version fuzz/corpus/extract -- -max_total_time=60
