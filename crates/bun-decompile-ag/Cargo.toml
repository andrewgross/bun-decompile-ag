[package]
name = "bun-decompile-ag"
description = "Extract the bundled sources from executables built with `bun build --compile`"
keywords = ["bun", "decompile", "extract", "reverse-engineering"]
categories = ["parser-implementations", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
## Serialize support for SourceMap (a standard v3 sourcemap JSON object).
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true

[lints]
workspace = true
